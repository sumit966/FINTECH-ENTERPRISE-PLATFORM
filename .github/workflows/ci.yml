name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus_user
          POSTGRES_PASSWORD: nexus_password
          POSTGRES_DB: nexus_platform
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U nexus_user -d nexus_platform"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://nexus_user:nexus_password@localhost:5432/nexus_platform?schema=public
      JWT_SECRET: ci-test-secret-do-not-use-in-prod
      JWT_EXPIRES_IN: 1h
      BCRYPT_ROUNDS: '4'
      BACKEND_PORT: '4100'
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate --schema=database/prisma/schema.prisma
      - name: Prisma migrate
        run: npx prisma migrate deploy --schema=database/prisma/schema.prisma
      - name: Backend typecheck
        working-directory: backend
        run: npx tsc -p tsconfig.json --noEmit
      - name: Backend tests
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Frontend build
        working-directory: frontend
        run: npm run build
